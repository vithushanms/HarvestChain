<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="t">Typical web game stack versus HarvestChain</title>
  <desc id="d">Left: a typical web game has five layers above the browser. Right: HarvestChain is one wasm module written by Claude Code, with a small JavaScript loader between it and the browser.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8e3a28"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="14" fill="#fbf6e9"/>

  <!-- left: typical stack -->
  <rect x="20" y="20" width="420" height="470" rx="10" fill="#efe8d4" stroke="#b9ad8c" stroke-width="2"/>
  <text x="230" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#5a5446">TYPICAL WEB GAME (ILLUSTRATIVE)</text>
  <g font-size="13" text-anchor="middle" fill="#5a5446">
    <rect x="50" y="75" width="360" height="52" rx="6" fill="#d9d3c3" stroke="#b9ad8c"/>
    <text x="230" y="97">game code</text><text x="230" y="115" font-size="11">TypeScript / JavaScript</text>
    <rect x="50" y="137" width="360" height="52" rx="6" fill="#d9d3c3" stroke="#b9ad8c"/>
    <text x="230" y="159">framework + UI library</text><text x="230" y="177" font-size="11">components, state, DOM or canvas wrapper</text>
    <rect x="50" y="199" width="360" height="52" rx="6" fill="#d9d3c3" stroke="#b9ad8c"/>
    <text x="230" y="221">bundler + transpiler</text><text x="230" y="239" font-size="11">node_modules, config, lockfile</text>
    <rect x="50" y="261" width="360" height="52" rx="6" fill="#d9d3c3" stroke="#b9ad8c"/>
    <text x="230" y="283">engine + asset pipeline</text><text x="230" y="301" font-size="11">images, fonts, audio files to ship and load</text>
    <rect x="50" y="323" width="360" height="52" rx="6" fill="#d9d3c3" stroke="#b9ad8c"/>
    <text x="230" y="345">JS engine + garbage collector</text><text x="230" y="363" font-size="11">runs and manages all of the above</text>
  </g>
  <rect x="50" y="410" width="360" height="52" rx="6" fill="#1f2437"/>
  <g font-size="13" text-anchor="middle" fill="#f4ecd8">
    <text x="230" y="432">browser</text><text x="230" y="450" font-size="11">canvas · storage · clipboard</text>
  </g>

  <!-- right: HarvestChain -->
  <rect x="520" y="20" width="420" height="470" rx="10" fill="#fbf6e9" stroke="#8e3a28" stroke-width="2"/>
  <text x="730" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#8e3a28">HARVESTCHAIN</text>

  <rect x="550" y="68" width="360" height="40" rx="6" fill="#8e3a28"/>
  <text x="730" y="93" text-anchor="middle" font-size="13" fill="#fbf6e9">Claude Code writes src/*.wat by hand</text>
  <line x1="730" y1="108" x2="730" y2="132" stroke="#8e3a28" stroke-width="2" marker-end="url(#ar)"/>
  <text x="742" y="125" font-size="10" fill="#8e3a28">tools/build.mjs</text>

  <rect x="550" y="134" width="360" height="206" rx="8" fill="#1f2437"/>
  <text x="730" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#f4ecd8">game.wasm · 36 KB gz · no imports</text>
  <g font-size="11" fill="#1f2437" text-anchor="middle">
    <rect x="564" y="168" width="162" height="46" rx="5" fill="#f4ecd8"/>
    <text x="645" y="188" font-weight="700">SIM (1x)</text><text x="645" y="204">state · End Day · RNG</text>
    <rect x="734" y="168" width="162" height="46" rx="5" fill="#f4ecd8"/>
    <text x="815" y="188" font-weight="700">3D RENDERER (21x)</text><text x="815" y="204">integer iso rasteriser</text>
    <rect x="564" y="222" width="162" height="46" rx="5" fill="#f4ecd8"/>
    <text x="645" y="242" font-weight="700">UI + INPUT (22x)</text><text x="645" y="258">layout · widgets · a11y</text>
    <rect x="734" y="222" width="162" height="46" rx="5" fill="#f4ecd8"/>
    <text x="815" y="242" font-weight="700">REPLAY + QR (24/25)</text><text x="815" y="258">share codes · viewer</text>
    <rect x="564" y="278" width="332" height="50" rx="5" fill="#2f3a5a" stroke="#f4ecd8" stroke-dasharray="4 3"/>
    <text x="730" y="298" fill="#f4ecd8" font-weight="700">one linear memory, fixed map</text>
    <text x="730" y="315" fill="#f4ecd8">no allocator · no GC · integer-only</text>
  </g>

  <line x1="730" y1="340" x2="730" y2="364" stroke="#8e3a28" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="742" y="357" font-size="10" fill="#8e3a28">input · frame · save</text>

  <rect x="550" y="366" width="360" height="44" rx="6" fill="#fbf6e9" stroke="#8e3a28" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="730" y="386" text-anchor="middle" font-size="13" fill="#8e3a28">index.html loader · 3.4 KB gz</text>
  <text x="730" y="402" text-anchor="middle" font-size="11" fill="#8e3a28">glue only · no game logic</text>

  <line x1="730" y1="410" x2="730" y2="432" stroke="#8e3a28" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="550" y="434" width="360" height="40" rx="6" fill="#1f2437"/>
  <text x="730" y="458" text-anchor="middle" font-size="13" fill="#f4ecd8">browser: wasm VM · canvas · storage</text>

  <!-- captions -->
  <g font-size="13" text-anchor="middle">
    <text x="230" y="520" fill="#5a5446" font-weight="700">several layers above the browser</text>
    <text x="730" y="520" fill="#8e3a28" font-weight="700">1 module + a loader that holds no game logic</text>
    <text x="480" y="545" fill="#5a5446" font-size="11">0 image files · 0 font files · 1 wasm · ~40 KB gz total transfer</text>
  </g>
</svg>
