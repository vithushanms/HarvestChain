<!doctype html>
<!-- HarvestChain loader: READABLE SOURCE OF TRUTH. `npm run build` minifies it into ../index.html.
     Dumb glue only (spec 14.2): no game logic, no hit-testing. Build placeholders: BG, MANIFEST (data-URI
     manifest incl. icon), KEYS (tools/keycodes.json), the theme colour. No external requests. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HarvestChain</title>
<meta name="theme-color" content="%BG%">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href='%MANIFEST%'>
<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:%BG%;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#a{position:fixed;clip-path:inset(50%)}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="HarvestChain farm game. Keys: E end day, H harvest, 1-5 tabs"></canvas>
<div id="a" role="status" aria-live="polite"></div>
<script>
// 1. load timer origin (also exposed for tests / the Task 7 load timer via window.__hc)
const t0 = performance.now();
const KEYS = '/*KEYS*/'.split(' ');   // KeyboardEvent.code list; key code = index + 1 (tools/keycodes.json)
const H = window.__hc = { t0, t1: 0, n: 0 };   // t1 = first blit; n = frame() calls; m = last set_metrics args
const cv = document.getElementById('c');
const live = document.getElementById('a');
const ctx = cv.getContext('2d');
const mq = matchMedia('(prefers-reduced-motion: reduce)');
// localStorage that never throws: ls(k) -> string|null, ls(k, v) -> 1 on success / 0 on failure
const ls = (k, v) => {
  try { return v === undefined ? localStorage.getItem(k) : (localStorage.setItem(k, v), 1); }
  catch { return v === undefined ? null : 0; }
};
// Failure message: replaces the canvas with an announced role=alert line; the aria-live region stays.
const fail = (m) => { cv.remove(); document.body.insertAdjacentHTML('afterbegin', '<p role=alert>' + (m || 'COULD NOT LOAD GAME') + ' - RELOAD</p>'); };
// A wasm trap (or any exception from a module call) ends the session: show a message, stop scheduling and input.
// The stored save is left as it is. Poisoned-save recovery: a boot that restores the save marks it (hc.bad)
// BEFORE any module call that could trap on it (restore, set_env, set_flags, set_pref, ui_boot, the first
// frame) and clears the mark after the first good frame. A trap in between leaves the mark (and copies the
// save to hc.save.bad), so the next boot starts without it (plain Title, no CONTINUE); the first successful
// save after that (a New Game) clears it. A trap after the first good frame does not mark a healthy save.
let dead = 0, mark = 0;
const keep = () => mark && ls('hc.save.bad', ls('hc.save'));
function die() {
  dead = 1;
  cancelAnimationFrame(raf); clearTimeout(tm);
  keep();
  fail('SOMETHING WENT WRONG');
}
const guard = (f) => (e) => { if (!dead) try { f(e); } catch { die(); } };

let ex;
// ---- metrics (spec 15.1 / 15.2): measured here, passed to the module (set_metrics) before every frame
let fu = 0, eu = 0;                          // last frame() + blit, last End Day: integer microseconds
const us = (a) => Math.round((performance.now() - a) * 1e3);
// Performance entries -> [transfer bytes of the page, game.wasm and sw.js (transferSize: 0 for a response from
// a cache, so 0 in all = "CACHED"; encodedBodySize where transferSize is missing), game.wasm bytes on the wire
// (encodedBodySize: gzip when the host compresses), game.wasm bytes decoded]
function sizes(list) {
  let t = 0, w = 0, r = 0;
  for (const e of list) {
    const n = e.name.split(/[?#]/)[0];
    if (e.entryType === 'navigation' || /(game\.wasm|sw\.js)$/.test(n)) {
      t += e.transferSize ?? e.encodedBodySize ?? 0;
      if (/\.wasm$/.test(n)) { w = e.encodedBodySize; r = e.decodedBodySize; }
    }
  }
  return [t, w, r];
}
// the module's input clock: set right before every pointer() / key() (frame() is not called while idle)
const clk = () => ex.set_now(Math.floor(performance.now()));
// a pointer / key call; the one during which the day changed is the End Day timing
function timed(f) {
  const d = ex.cur_day(), a = performance.now();
  clk();
  f();
  if (ex.cur_day() !== d) eu = us(a);
}
let raf = 0, tm = 0, rz = 1, seq = 0, lastPrefs = -1, active = null, lastT = 0, retry = 0;
const held = new Set();

// ---- scheduling (5): frame() only while the module wants it; idle = zero CPU
function schedule() {
  if (dead || !ex || document.hidden || raf) return;
  clearTimeout(tm); tm = 0;
  raf = requestAnimationFrame(run);
}
function run() {
  raf = 0;
  if (dead) return;
  let r;
  try {
    if (rz) resize();
    H.n++;
    const P = performance, E = (t) => P.getEntriesByType?.(t) || [];   // (not on every engine)
    ex.set_metrics(...(H.m = [H.t1 ? Math.round(H.t1 - t0) : 0, ...sizes(E('navigation').concat(E('resource'))), eu, fu]));
    const a = P.now();
    r = ex.frame(Math.floor(a));               // 0 idle | 1 animating | 2 ambient only
    blit();
    fu = us(a);
    post();
    if (!H.t1) {                               // once: the first good frame
      H.t1 = performance.now(); register();
      if (mark) { mark = 0; ls('hc.bad', ''); }
      r = 1;                                   // one more frame: the load line shows the measured time
      // 8. a #code link: only now, outside the save-mark window (a trap in a hostile hash must not
      //    blame the save); the module decodes and validates it, garbage is ignored, the hash dropped
      if (location.hash.length > 1 && code(location.hash)) history.replaceState(null, '', here);
    }
  } catch { return die(); }
  if (r === 1) raf = requestAnimationFrame(run);
  else if (r === 2) tm = setTimeout(() => { tm = 0; schedule(); }, 83);
}

// ---- canvas (3, 6)
function resize() {
  rz = 0;
  ex.resize(innerWidth, innerHeight, Math.round(devicePixelRatio * 100));
  const fw = ex.fb_w(), fh = ex.fb_h();   // backing store = module's logical size; CSS scales it nearest-neighbour
  if (cv.width !== fw) cv.width = fw;    // assigning clears the bitmap, so only on a real change
  if (cv.height !== fh) cv.height = fh;
}
function blit() {
  const w = ex.fb_w(), h = ex.fb_h();
  if (w * h) ctx.putImageData(new ImageData(new Uint8ClampedArray(ex.memory.buffer, ex.fb_ptr(), w * h * 4), w, h), 0, 0);
}
const dirty = () => { rz = 1; schedule(); };

// ---- persistence (6), prefs (7), aria-live (9): all after every frame
function save(force) {
  if (!ex.need_save() || (!force && performance.now() < retry)) return;
  if (ls('hc.save', btoa(String.fromCharCode(...new Uint8Array(ex.memory.buffer, ex.save_ptr(), ex.save_len()))))) {
    ex.ack_save(); ls('hc.bad', '');
    ls('hc.log', ex.share_build() ? str(ex.share_ptr(), ex.share_len()) : '');   // the input log (share code) beside it
  }
  else {                                     // storage full / blocked: keep need_save set and try again in 2 s
    retry = performance.now() + 2000;
    setTimeout(schedule, 2100);                // the next frame saves again
  }
}
function post() {
  save();
  const f = ex.get_flags() & 5;               // bit0 large text, bit2 gazette off (bit1 = OS reduced motion, not stored)
  if (f !== lastPrefs) {
    lastPrefs = f;
    ls('hc.prefs', JSON.stringify({ large: f & 1, noGazette: f >> 2 }));
  }
  const s = ex.announce_seq();
  if (s !== seq) {
    seq = s;
    live.textContent = str(ex.announce_ptr(), ex.announce_len());
  }
}
// bytes -> module io buffer (16 KB region 0x10000..0x13FFF = IO_SIZE). Returns length or 0 when it does not fit.
function toIo(bin) {
  const n = bin.length;
  if (!n || n > 16384) return 0;
  const u = new Uint8Array(ex.memory.buffer, ex.io_buf(), n);
  u.set(Uint8Array.from(bin, (c) => c.charCodeAt()));
  return n;
}
const str = (p, n) => new TextDecoder().decode(new Uint8Array(ex.memory.buffer, p, n));
// A replay code or link (text) -> replay_load; 1 when the module took it (Title: WATCH SHARED RUN)
const code = (t) => { const n = toIo(t); return n && !ex.replay_load(ex.io_buf(), n); };
// Restore the save (+ its log). Throws on a module trap (load / replay_restore): main() treats that as a
// poisoned boot. Undecodable base64 is just "no save".
function restore() {
  let n;
  try { n = toIo(atob(ls('hc.save') || '')); } catch { return 0; }
  if (!n || ex.load(ex.io_buf(), n)) return 0;   // a bad save is left in place until a new save overwrites it
  const m = toIo(ls('hc.log') || '');           // its input log: kept only if it replays to this exact state
  if (m) ex.replay_restore(ex.io_buf(), m);
  return 1;
}
// COPY CODE: the module asks during a pointer / key handler (a user gesture); copy the share link
function copy() {
  if (!ex.want_copy()) return;
  try { navigator.clipboard.writeText(str(ex.share_url_ptr(), ex.share_url_len())).catch(() => {}); } catch {}
  ex.ack_copy();
}
function prefs() {
  try { return Object(JSON.parse(ls('hc.prefs'))); } catch { return {}; }   // null / a number -> no prefs
}

// ---- input (4)
function pt(e, type) {
  const r = cv.getBoundingClientRect();
  lastT = performance.now();
  timed(() => ex.pointer(Math.round(e.clientX - r.left), Math.round(e.clientY - r.top), type));
  copy();
  schedule();
}
// cancel the active pointer: type 3 ends the press with no tap, scroll or dismiss (src/22_ui.wat)
function drop() {
  if (active === null) return;
  active = null;
  clk();
  ex.pointer(-1, -1, 3);
  schedule();
}
function bind() {
  cv.oncontextmenu = (e) => e.preventDefault();
  cv.onpointerdown = guard((e) => {
    if (!e.isPrimary || e.button > 0) return;                  // primary pointer, left button / touch only
    if (active !== null) {
      if (performance.now() - lastT < 1000) return;
      drop();                                                  // stale: its up never arrived
    }
    active = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch {}
    pt(e, 0);
  });
  cv.onpointermove = guard((e) => { e.isPrimary && pt(e, 1); });
  const up = guard((e) => {
    if (e.pointerId !== active) return;
    active = null;
    pt(e, 2);
  });
  cv.onpointerup = up;
  cv.onlostpointercapture = up;
  cv.onpointercancel = guard((e) => { if (e.pointerId === active) drop(); });
  // Task 7: cv.onwheel -> ex.wheel(...) once the export exists (feature-detect it).
  const key = (d) => guard((e) => {
    const c = KEYS.indexOf(e.code) + 1;
    if (!c || e.isComposing) return;
    if (!d) {                                  // always release a held key, whatever modifiers are down now
      if (held.delete(c)) { clk(); ex.key(c, 0); schedule(); }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    if (e.repeat) return;                       // module acts once per press; drop auto-repeat
    held.add(c);
    timed(() => ex.key(c, 1));
    copy();
    schedule();
  });
  onkeydown = key(1);
  onkeyup = key(0);
  const release = guard(() => { for (const c of held) clk(), ex.key(c, 0); held.clear(); drop(); schedule(); });
  onblur = release;
  onresize = onorientationchange = dirty;     // (event handler properties: nothing else sets them)
  if (window.visualViewport) visualViewport.onresize = dirty;
  onpagehide = guard(() => { release(); save(1); });
  document.onvisibilitychange = guard(() => {
    if (document.hidden) { release(); save(1); } else dirty();
  });
  document.onpaste = guard((e) => { const t = e.clipboardData && e.clipboardData.getData('text'); if (t && code(t)) schedule(); });
  const flags = guard(() => { ex.set_flags(mq.matches, ex.get_flags() & 1); schedule(); });
  mq.onchange = flags;
}

// ---- service worker (10): after the first frame, never on file://
function register() {
  if (!navigator.serviceWorker || location.protocol === 'file:') return;
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {}
}

let here;
async function main() {
  let r, has = 0;
  try { r = await WebAssembly.instantiateStreaming(fetch('game.wasm'), {}); }
  catch { r = await WebAssembly.instantiate(await (await fetch('game.wasm')).arrayBuffer(), {}); }
  H.ex = ex = r.instance.exports;
  const p = prefs();
  if (!ls('hc.bad') && ls('hc.save')) { mark = 1; ls('hc.bad', '1'); }   // see die(): cleared after the first good frame
  if (mark) try { has = restore(); }               // a save marked bad by a trap is skipped
  catch {                                          // a trap restoring it: poisoned boot. The mark stays (and the
    keep(); mark = 0; has = 0;                     // copy), and a fresh instance starts a new game (the trapped
    H.ex = ex = (await WebAssembly.instantiate(r.module, {})).exports;   // one may be left mid-replay)
  }
  const seed = crypto.getRandomValues(new Uint32Array(1))[0];
  ex.set_env(seed | 0, Math.floor(Date.now() / 86400000));
  ex.set_flags(mq.matches, p.large ? 1 : 0);
  ex.set_pref(2, p.noGazette ? 1 : 0);
  ex.ui_boot(has);
  // 8. share link origin: the page URL without the hash (the #code itself is taken after the first frame)
  here = location.href.split('#')[0];
  ex.set_origin(toIo(here));
  bind();
  rz = 1;
  schedule();
}
if (!window.WebAssembly) fail(); else main().catch(() => { keep(); fail(); });
</script>
</body>
</html>
